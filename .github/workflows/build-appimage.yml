name: Build and Package AppImage

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          curl \
          file \
          libfuse2t64 \
          qt6-base-dev \
          qt6-declarative-dev \
          qt6-multimedia-dev \
          libqt6svg6-dev \
          libkf6kirigami-dev \
          libkf6coreaddons-dev \
          qml6-module-qtquick \
          qml6-module-qtquick-controls \
          qml6-module-qtquick-layouts \
          qml6-module-qtquick-templates2 \
          qml6-module-qtquick-effects \
          qml6-module-qtmultimedia \
          qml6-module-org-kde-kirigami

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure -C Release

    - name: Package AppImage
      run: |
        chmod +x packaging/build_appimage.sh
        ./packaging/build_appimage.sh

    - name: Verify AppImage Created
      run: |
        test -s MusicFocus-x86_64.AppImage
        ls -lh MusicFocus-x86_64.AppImage

    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicFocus-x86_64
        path: MusicFocus-x86_64.AppImage
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: MusicFocus-x86_64
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MusicFocus-x86_64.AppImage
          generate_release_notes: true
